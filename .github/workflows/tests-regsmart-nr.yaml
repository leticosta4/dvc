name: Tests regsmart no-rtp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGSMART_PACKAGE: "git+https://github.com/leticosta4/pytest-regsmart@e8fe612271bc27698cd8285a535209262e8e1a03"

jobs:

  tests-regsmart-nr:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python (3.12)
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - run: uv pip install -e ".[dev]" --system

    - name: Install pytest-regsmart
      run: |
        uv pip install --system "$REGSMART_PACKAGE"
        uv pip freeze --system


    - name: run tests (py312)
      timeout-minutes: 40
      env:
        PYTHONUTF8: 1
      run: >
        pytest --regsmart --no-rank -n=logical --dist=worksteal --timeout=300 --durations=0
        --cov --cov-report=xml --cov-report=term
